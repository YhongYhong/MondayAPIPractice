<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
            background: #f8f9fa;
        }
        button {
            padding: 14px 32px;
            font-size: 18px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.25s;
            margin: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        button:active {
            transform: scale(0.97);
        }
        #editBtn {
            background: #6c757d;
        }
        #editBtn:hover {
            background: #545b62;
        }
    </style>
</head>
<body>
    <h1>Webhook Simulations</h1>
    <button id="createBtn">Simulate Create Items Webhook</button>
    <button id="updateBtn">Simulate Update Items Webhook</button>

    <script>
        document.getElementById('createBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('http://localhost:3001/simulate-create-items', {
                    method: 'POST'
                });
                const data = await response.json();
                console.log('Simulation result:', data);
                if (data.ok) {
                    alert('Create items simulation successful: File uploaded to Monday.');
                } else {
                    alert('Simulation failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Fetch error:', error);
                alert('Error: ' + error.message);
            }
        });

        document.getElementById('updateBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('http://localhost:3001/simulate-update-items', {
                    method: 'POST'
                });
                const data = await response.json();
                console.log('Simulation result:', data);
                if (data.ok) {
                    alert('Edit items simulation successful: Files downloaded, processed, and email sent.');
                } else {
                    alert('Simulation failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Fetch error:', error);
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
