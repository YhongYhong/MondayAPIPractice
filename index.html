<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Document Approval</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f8f9fa;
    padding: 40px;
    text-align: center;
  }

  h1 {
    font-size: 24px;
  }

  #approveBtn {
    padding: 14px 32px;
    font-size: 18px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.25s;
    margin-top: 20px;
  }

  #approveBtn:active {
    transform: scale(0.97);
  }

  #approvedMessage {
    margin-top: 20px;
    font-size: 20px;
    color: green;
    display: none;
    font-weight: bold;
  }

  #signature-pad {
    border: 2px dashed #aaa;
    width: 300px;
    height: 200px;
    margin: 20px auto;
    background: white;
  }

  #clearBtn {
    margin-top: 10px;
    padding: 8px 20px;
    font-size: 14px;
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>Approval Confirmation</h1>
<p>Please sign below to confirm your approval.</p>

<canvas id="signature-pad"></canvas>
<br>
<button id="clearBtn">Clear Signature</button>

<button id="approveBtn">Approve</button>

<div id="approvedMessage" class="fade-in">✔ Signature Captured. Approved.</div>

<!-- Signature Pad Library -->
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.5/dist/signature_pad.umd.min.js"></script>

<script>
  // Initialize signature pad
  const canvas = document.getElementById("signature-pad");
  const signaturePad = new SignaturePad(canvas);

  // Resize canvas for retina displays
  function resizeCanvas() {
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    canvas.getContext("2d").scale(ratio, ratio);
  }
  resizeCanvas();
  window.onresize = resizeCanvas;

  // Clear signature
  document.getElementById("clearBtn").addEventListener("click", () => {
    signaturePad.clear();
  });

  // Approve with signature
  document.getElementById("approveBtn").addEventListener("click", function () {
    if (signaturePad.isEmpty()) {
      alert("Please provide a signature before approving.");
      return;
    }

    // Convert signature to image
    const signatureDataURL = signaturePad.toDataURL();

    console.log("Signature Captured:", signatureDataURL);

    // Hide the approve button
    this.style.display = "none";

    // Show confirmation
    const msg = document.getElementById("approvedMessage");
    msg.style.display = "block";

    // OPTIONAL:
    // ส่งข้อมูล signatureDataURL กลับไปยัง Monday / Webhook / Email ได้
    // ตอนนี้ version นี้เก็บเฉพาะใน frontend
  });
</script>

</body>
</html>
